<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GMAZ · Selección Top 120 Clientes</title>
<style>
:root{
  --rojo:#E4002B; --rojo-osc:#B00020; --negro:#1A1A1A; --gris:#6B6B6B;
  --gris-claro:#F2F2F0; --borde:#E0E0DE; --blanco:#FFFFFF; --verde:#1B8A4C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--gris-claro);color:var(--negro);padding-bottom:110px}
header{background:var(--rojo);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
header p{font-size:12px;opacity:.92;margin-top:2px}
.card{background:#fff;border-radius:14px;margin:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
label{display:block;font-size:12px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
input[type=text],select{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--negro)}
input:focus,select:focus{outline:none;border-color:var(--rojo)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.3px}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-rojo:disabled{background:#C9C9C7;color:#8a8a88}
.btn-sec{background:#fff;color:var(--rojo);border:1.5px solid var(--rojo);margin-top:10px}
#paso2,#pasoOk{display:none}
.barra-busq{position:sticky;top:64px;z-index:15;background:var(--gris-claro);padding:10px 14px 8px}
.busq-wrap{position:relative}
.busq-wrap input{padding-left:40px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:none}
.busq-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45}
.info-ruta{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 0;font-size:13px;color:var(--gris)}
.info-ruta b{color:var(--negro)}
#lista{margin:8px 14px 0}
.cli{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:2px solid transparent;cursor:pointer;user-select:none}
.cli.sel{border-color:var(--rojo);background:#FFF5F6}
.chk{width:26px;height:26px;min-width:26px;border-radius:50%;border:2px solid #C9C9C7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;transition:all .12s}
.cli.sel .chk{background:var(--rojo);border-color:var(--rojo)}
.cli-txt{flex:1;min-width:0}
.cli-nom{font-size:14.5px;font-weight:700;line-height:1.25}
.cli-det{font-size:12px;color:var(--gris);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-cod{font-size:11px;color:var(--rojo);font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.vacio{text-align:center;color:var(--gris);font-size:14px;padding:30px 20px}
.pie{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.12);z-index:30}
.prog-wrap{height:7px;background:var(--gris-claro);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog{height:100%;width:0%;background:var(--rojo);border-radius:4px;transition:width .2s}
.prog.full{background:var(--verde)}
.pie-fila{display:flex;gap:10px;align-items:center}
.contador{font-size:15px;font-weight:800;min-width:92px;font-variant-numeric:tabular-nums}
.contador.full{color:var(--verde)}
.pie .btn{flex:1;padding:13px}
#verSel{background:#fff;border:1.5px solid var(--borde);color:var(--negro);width:auto;padding:13px 14px;font-size:13px;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;align-items:flex-end}
.modal.abierto{display:flex}
.hoja{background:#fff;width:100%;max-height:75vh;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.hoja h3{font-size:16px;margin-bottom:12px}
.sel-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gris-claro)}
.sel-num{font-size:12px;font-weight:800;color:var(--rojo);min-width:22px;font-variant-numeric:tabular-nums}
.sel-txt{flex:1;font-size:13.5px;font-weight:600;min-width:0}
.sel-txt small{display:block;color:var(--gris);font-weight:400;font-size:11.5px}
.quitar{border:none;background:var(--gris-claro);color:var(--rojo);width:30px;height:30px;border-radius:50%;font-size:16px;font-weight:800;cursor:pointer}
.ok-icon{width:74px;height:74px;border-radius:50%;background:var(--verde);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
#pasoOk .card{text-align:center;padding:34px 20px}
#pasoOk h2{font-size:19px;margin-bottom:8px}
#pasoOk p{font-size:14px;color:var(--gris);line-height:1.5}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:gira .7s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes gira{to{transform:rotate(360deg)}}
.aviso-err{background:#FDEBEC;color:var(--rojo-osc);border-radius:10px;padding:12px;font-size:13px;margin-top:12px;display:none}
</style>
</head>

<header>
  <h1>GMAZ · Selección Top 120 Clientes</h1>
  <p id="subHeader">Escoge los 120 clientes de tu ruta</p>
</header>

<!-- PASO 1 -->
<div id="paso1">
  <div class="card">
    <label for="vendedor">Nombre del vendedor</label>
    <input type="text" id="vendedor" placeholder="Ej: Carlos Rodríguez" autocomplete="name">
    <label for="ruta">Ruta</label>
    <select id="ruta"><option value="">— Selecciona tu ruta —</option></select>
    <div style="margin-top:20px">
      <button class="btn btn-rojo" id="btnContinuar">Continuar</button>
    </div>
  </div>
</div>

<!-- PASO 2 -->
<div id="paso2">
  <div class="barra-busq">
    <div class="busq-wrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input type="text" id="buscar" placeholder="Buscar por nombre, código o dirección…">
    </div>
  </div>
  <div class="info-ruta"><span>Ruta <b id="rutaLbl"></b> · <span id="nClientes"></span> clientes</span><span id="nMostrados"></span></div>
  <div id="lista"></div>
</div>

<!-- OK -->
<div id="pasoOk">
  <div class="card">
    <div class="ok-icon">✓</div>
    <h2>¡Selección enviada!</h2>
    <p id="okDetalle"></p>
    <button class="btn btn-sec" id="btnOtra" style="margin-top:22px">Registrar otra ruta</button>
  </div>
</div>

<!-- Pie fijo -->
<div class="pie" id="pie" style="display:none">
  <div class="prog-wrap"><div class="prog" id="prog"></div></div>
  <div class="pie-fila">
    <span class="contador" id="contador">0 / 20</span>
    <button id="verSel">Ver selección</button>
    <button class="btn btn-rojo" id="btnEnviar" disabled>Enviar</button>
  </div>
  <div class="aviso-err" id="avisoErr"></div>
</div>

<!-- Modal seleccionados -->
<div class="modal" id="modal">
  <div class="hoja">
    <h3>Clientes seleccionados (<span id="modalN">0</span>)</h3>
    <div id="modalLista"></div>
    <button class="btn btn-sec" id="cerrarModal" style="margin-top:14px">Cerrar</button>
  </div>
</div>

const $ = id => document.getElementById(id);
let rutaActual = '', clientesRuta = [], seleccion = new Map(); // codigo -> [cod,cli,dir,bar,mun]

// Poblar rutas
Object.keys(DATA).sort().forEach(r => {
  const o = document.createElement('option');
  o.value = r; o.textContent = r + '  (' + DATA[r].length + ' clientes)';
  $('ruta').appendChild(o);
});

// Restaurar borrador
try {
  const d = JSON.parse(localStorage.getItem('gmaz_top20_borrador') || 'null');
  if (d && d.vendedor) { $('vendedor').value = d.vendedor; if (DATA[d.ruta]) $('ruta').value = d.ruta; }
} catch(e){}

$('btnContinuar').onclick = () => {
  const v = $('vendedor').value.trim(), r = $('ruta').value;
  if (!v) { alert('Escribe tu nombre.'); return; }
  if (!r) { alert('Selecciona tu ruta.'); return; }
  rutaActual = r;
  clientesRuta = DATA[r];
  META = Math.min(META_BASE, clientesRuta.length);
  seleccion.clear();
  // restaurar selección guardada de esta ruta
  try {
    const d = JSON.parse(localStorage.getItem('gmaz_top20_borrador') || 'null');
    if (d && d.ruta === r && Array.isArray(d.codigos)) {
      const idx = {}; clientesRuta.forEach(c => idx[c[0]] = c);
      d.codigos.forEach(cod => { if (idx[cod]) seleccion.set(cod, idx[cod]); });
    }
  } catch(e){}
  $('paso1').style.display = 'none';
  $('paso2').style.display = 'block';
  $('pie').style.display = 'block';
  $('rutaLbl').textContent = r;
  $('nClientes').textContent = clientesRuta.length;
  $('subHeader').textContent = $('vendedor').value.trim() + ' · Ruta ' + r + (META < META_BASE ? ' · esta ruta tiene ' + META + ' clientes: escógelos todos' : '');
  render(); actualizarPie();
};

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function render(){
  const q = norm($('buscar').value.trim());
  const lista = $('lista');
  let items = clientesRuta;
  if (q) items = clientesRuta.filter(c => norm(c[0]+' '+c[1]+' '+c[2]+' '+c[3]).includes(q));
  $('nMostrados').textContent = q ? items.length + ' resultados' : '';
  if (!items.length) { lista.innerHTML = '<div class="vacio">Sin resultados para esa búsqueda.</div>'; return; }
  lista.innerHTML = items.map(c => {
    const sel = seleccion.has(c[0]);
    return '<div class="cli' + (sel?' sel':'') + '" data-cod="' + c[0] + '">' +
      '<div class="chk">' + (sel?'✓':'') + '</div>' +
      '<div class="cli-txt"><div class="cli-nom">' + esc(c[1]) + '</div>' +
      '<div class="cli-det">' + esc(c[2]) + (c[3]?' · '+esc(c[3]):'') + '</div>' +
      '<div class="cli-cod">' + c[0] + '</div></div></div>';
  }).join('');
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

$('lista').addEventListener('click', e => {
  const el = e.target.closest('.cli'); if (!el) return;
  const cod = el.dataset.cod;
  if (seleccion.has(cod)) {
    seleccion.delete(cod);
    el.classList.remove('sel'); el.querySelector('.chk').textContent = '';
  } else {
    if (seleccion.size >= META) { avisar('Ya escogiste ' + META + ' clientes. Quita uno para agregar otro.'); return; }
    const c = clientesRuta.find(x => x[0] === cod);
    seleccion.set(cod, c);
    el.classList.add('sel'); el.querySelector('.chk').textContent = '✓';
  }
  guardarBorrador(); actualizarPie();
});

let tBusq;
$('buscar').addEventListener('input', () => { clearTimeout(tBusq); tBusq = setTimeout(render, 120); });

function actualizarPie(){
  const n = seleccion.size;
  $('contador').textContent = n + ' / ' + META;
  $('contador').classList.toggle('full', n === META);
  const p = $('prog'); p.style.width = (n/META*100) + '%'; p.classList.toggle('full', n === META);
  $('btnEnviar').disabled = n !== META;
  $('modalN').textContent = n;
}

function avisar(msg){
  const a = $('avisoErr'); a.textContent = msg; a.style.display = 'block';
  clearTimeout(avisar.t); avisar.t = setTimeout(() => a.style.display = 'none', 3500);
}

function guardarBorrador(){
  try { localStorage.setItem('gmaz_top20_borrador', JSON.stringify({
    vendedor: $('vendedor').value.trim(), ruta: rutaActual, codigos: [...seleccion.keys()]
  })); } catch(e){}
}

// Modal
$('verSel').onclick = () => {
  const ml = $('modalLista');
  if (!seleccion.size) { ml.innerHTML = '<div class="vacio">Aún no has escogido clientes.</div>'; }
  else {
    let i = 0;
    ml.innerHTML = [...seleccion.values()].map(c => {
      i++;
      return '<div class="sel-item"><span class="sel-num">' + i + '</span>' +
        '<div class="sel-txt">' + esc(c[1]) + '<small>' + c[0] + ' · ' + esc(c[2]) + '</small></div>' +
        '<button class="quitar" data-cod="' + c[0] + '">×</button></div>';
    }).join('');
  }
  $('modal').classList.add('abierto');
};
$('cerrarModal').onclick = () => $('modal').classList.remove('abierto');
$('modal').addEventListener('click', e => {
  if (e.target === $('modal')) $('modal').classList.remove('abierto');
  const b = e.target.closest('.quitar'); if (!b) return;
  seleccion.delete(b.dataset.cod);
  guardarBorrador(); actualizarPie(); render(); $('verSel').click();
});

// Enviar
$('btnEnviar').onclick = async () => {
  if (seleccion.size !== META) return;
  if (SCRIPT_URL.indexOf('PEGA_AQUI') === 0) { avisar('Falta configurar la URL del Apps Script en el archivo.'); return; }
  const btn = $('btnEnviar');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Enviando…';
  const payload = {
    vendedor: $('vendedor').value.trim(),
    ruta: rutaActual,
    fecha: new Date().toLocaleString('es-CO'),
    clientes: [...seleccion.values()].map((c,i) => ({ pos: i+1, codigo: c[0], cliente: c[1], direccion: c[2], barrio: c[3], municipio: c[4] }))
  };
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
    const j = await res.json();
    if (!j || j.ok !== true) throw new Error(j && j.error ? j.error : 'Respuesta inválida');
    localStorage.removeItem('gmaz_top20_borrador');
    $('paso2').style.display = 'none'; $('pie').style.display = 'none';
    $('pasoOk').style.display = 'block';
    $('okDetalle').textContent = payload.vendedor + ' · Ruta ' + payload.ruta + ' · ' + META + ' clientes registrados el ' + payload.fecha + '.';
    window.scrollTo(0,0);
  } catch(err) {
    avisar('No se pudo enviar. Revisa tu conexión e intenta de nuevo.');
    btn.disabled = false; btn.textContent = 'Enviar';
  }
};

$('btnOtra').onclick = () => {
  seleccion.clear(); $('buscar').value = '';
  $('pasoOk').style.display = 'none'; $('paso1').style.display = 'block';
  $('subHeader').textContent = 'Escoge los 120 clientes de tu ruta';
  $('btnEnviar').disabled = true; $('btnEnviar').textContent = 'Enviar';
  window.scrollTo(0,0);
};
</script>
